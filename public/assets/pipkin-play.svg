<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="playBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="50%" stop-color="#dcfce7" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#playBg)" />
  <circle cx="300" cy="225" r="180" fill="url(#sunburst)" />

  <!-- Playful Dancing Pipkin Silhouette & Colors -->
  <g transform="translate(300, 240)">
    <!-- Joyful Bouncing Pony -->
    <!-- Tail swoosh -->
    <path d="M -90 -20 C -140 -50, -170 20, -120 70 C -90 50, -80 10, -70 -10 Z" fill="#c084fc" />
    <path d="M -85 -10 C -120 -30, -140 20, -105 50 C -85 30, -75 10, -70 0 Z" fill="#f472b6" />

    <!-- Body tilted joyfully -->
    <ellipse cx="-20" cy="15" rx="75" ry="55" fill="#ffffff" transform="rotate(-15 -20 15)" />

    <!-- Legs in cute dance pose -->
    <path d="M -60 45 Q -80 95 -60 115" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M -60 110 L -60 120" stroke="#fde047" stroke-width="22" stroke-linecap="round" fill="none" />

    <path d="M -20 50 Q -10 100 15 110" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" />
    <path d="M 12 105 L 18 115" stroke="#fde047" stroke-width="20" stroke-linecap="round" fill="none" />

    <!-- Front legs kicking up playfully -->
    <path d="M 30 20 Q 75 40 90 20" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" />
    <circle cx="92" cy="18" r="10" fill="#fde047" />

    <path d="M 15 0 Q 60 -15 80 -40" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" />
    <circle cx="82" cy="-42" r="10" fill="#fde047" />

    <!-- Head & joyful expression -->
    <ellipse cx="40" cy="-60" rx="50" ry="44" fill="#ffffff" />
    <ellipse cx="65" cy="-55" rx="30" ry="22" fill="#fff1f2" />
    <!-- Happy curved closed eye -->
    <path d="M 50 -68 Q 62 -80 74 -68" stroke="#581c87" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Cheerful blush -->
    <circle cx="68" cy="-52" r="12" fill="#fb7185" opacity="0.5" filter="url(#glow3)" />
    <!-- Cute open smile -->
    <path d="M 68 -45 Q 76 -35 84 -48" stroke="#be185d" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Little ears -->
    <path d="M 20 -95 C 10 -125, 30 -135, 45 -110 Z" fill="#ffffff" />
    <path d="M 25 -98 C 18 -118, 30 -125, 40 -110 Z" fill="#fda4af" />

    <!-- Flowing mane with flower -->
    <path d="M 10 -80 C -20 -110, -40 -60, -20 -30 Z" fill="#f472b6" />
    <path d="M 25 -85 C 0 -110, -10 -70, 0 -50 Z" fill="#c084fc" />
    <circle cx="35" cy="-90" r="8" fill="#fde047" />
  </g>

  <!-- Floating Butterflies -->
  <g transform="translate(130, 110)">
    <!-- Wings Left & Right -->
    <path d="M 0 0 C -20 -30, -35 0, 0 0 C -25 20, -15 30, 0 0" fill="#f472b6" />
    <path d="M 0 0 C 20 -30, 35 0, 0 0 C 25 20, 15 30, 0 0" fill="#f472b6" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#701a75" stroke-width="2" />
  </g>

  <g transform="translate(470, 120) rotate(15)">
    <path d="M 0 0 C -18 -25, -30 0, 0 0 C -20 18, -12 25, 0 0" fill="#38bdf8" />
    <path d="M 0 0 C 18 -25, 30 0, 0 0 C 20 18, 12 25, 0 0" fill="#38bdf8" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#0369a1" stroke-width="2" />
  </g>

  <!-- Musical Joy Notes & Sparkles -->
  <g fill="#a855f7">
    <!-- Note 1 -->
    <circle cx="430" cy="190" r="6" />
    <line x1="436" y1="190" x2="436" y2="165" stroke="#a855f7" stroke-width="2.5" />
    <path d="M 436 165 C 445 165, 450 175, 452 178" stroke="#a855f7" stroke-width="2.5" fill="none" />
    <!-- Note 2 -->
    <circle cx="160" cy="220" r="5" />
    <line x1="165" y1="220" x2="165" y2="200" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Confetti and Star Sparkles -->
  <g>
    <rect x="230" y="80" width="8" height="14" rx="3" fill="#f43f5e" transform="rotate(25 230 80)" />
    <rect x="360" y="90" width="8" height="14" rx="3" fill="#3b82f6" transform="rotate(-35 360 90)" />
    <rect x="180" y="320" width="8" height="14" rx="3" fill="#10b981" transform="rotate(45 180 320)" />
    <rect x="420" y="310" width="8" height="14" rx="3" fill="#f59e0b" transform="rotate(-20 420 310)" />

    <polygon points="480,240 484,248 492,250 486,256 488,264 480,260 472,264 474,256 468,250 476,248" fill="#fde047" />
    <polygon points="120,260 123,266 129,267 125,271 126,277 120,274 114,277 115,271 111,267 117,266" fill="#f472b6" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="animBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#animBg)" />

  <!-- Animation Keyframe Filmstrip Border Top & Bottom -->
  <g fill="rgba(255,255,255,0.15)">
    <rect x="20" y="20" width="25" height="18" rx="3" />
    <rect x="65" y="20" width="25" height="18" rx="3" />
    <rect x="110" y="20" width="25" height="18" rx="3" />
    <rect x="155" y="20" width="25" height="18" rx="3" />
    <rect x="200" y="20" width="25" height="18" rx="3" />
    <rect x="245" y="20" width="25" height="18" rx="3" />
    <rect x="290" y="20" width="25" height="18" rx="3" />
    <rect x="335" y="20" width="25" height="18" rx="3" />
    <rect x="380" y="20" width="25" height="18" rx="3" />
    <rect x="425" y="20" width="25" height="18" rx="3" />
    <rect x="470" y="20" width="25" height="18" rx="3" />
    <rect x="515" y="20" width="25" height="18" rx="3" />
    <rect x="560" y="20" width="25" height="18" rx="3" />
  </g>

  <!-- Dynamic Motion Arc -->
  <path d="M 80 340 Q 280 80 500 280" stroke="url(#arcGrad)" stroke-width="4" stroke-dasharray="8,8" fill="none" />

  <!-- Animation Ghosting / Onion Skin Poses -->
  <!-- Pose 1 (Anticipation / Crouch) -->
  <g transform="translate(110, 310) scale(0.6)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="#fbcfe8" />
    <circle cx="35" cy="-25" r="28" fill="#fbcfe8" />
  </g>

  <!-- Pose 2 (Takeoff) -->
  <g transform="translate(200, 230) rotate(-15) scale(0.65)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="55" ry="35" fill="#f472b6" />
    <circle cx="40" cy="-25" r="28" fill="#f472b6" />
  </g>

  <!-- Pose 3 (Peak Apex Jump) -->
  <g transform="translate(300, 150) rotate(10) scale(0.75)" opacity="0.95">
    <!-- Starburst behind -->
    <polygon points="0,-45 10,-10 45,0 10,10 0,45 -10,10 -45,0 -10,-10" fill="#fde047" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="#ffffff" />
    <circle cx="45" cy="-28" r="30" fill="#ffffff" />
    <ellipse cx="55" cy="-30" rx="6" ry="10" fill="#7c3aed" />
    <path d="M -30 -10 C -60 -40, -80 0, -50 20 Z" fill="#ec4899" />
  </g>

  <!-- Pose 4 (Joyful Landing) -->
  <g transform="translate(450, 260) rotate(-5) scale(0.68)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="55" ry="38" fill="#fbcfe8" />
    <circle cx="40" cy="-25" r="28" fill="#fbcfe8" />
  </g>

  <!-- Action Sparkles and Stardust Trail -->
  <g fill="#fde047">
    <circle cx="160" cy="270" r="5" />
    <circle cx="230" cy="180" r="4" />
    <circle cx="360" cy="130" r="6" />
    <circle cx="400" cy="200" r="4.5" />
    <polygon points="340,90 344,98 352,100 346,106 348,114 340,110 332,114 334,106 328,100 336,98" fill="#ffffff" />
  </g>

  <!-- Timeline Playhead & Graph Curve -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="480" height="24" rx="12" fill="rgba(0,0,0,0.3)" />
    <!-- Progress bar -->
    <rect x="0" y="0" width="280" height="24" rx="12" fill="url(#arcGrad)" opacity="0.8" />
    <!-- Playhead circle -->
    <circle cx="280" cy="12" r="16" fill="#ffffff" />
    <circle cx="280" cy="12" r="8" fill="#ec4899" />
  </g>
</svg>

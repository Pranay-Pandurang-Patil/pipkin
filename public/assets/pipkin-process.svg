<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="processBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="50%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#processBg)" />

  <!-- Studio Desk Wood / Surface Texture lines -->
  <line x1="30" y1="410" x2="570" y2="410" stroke="#fdba74" stroke-width="2" />

  <!-- 3D Modeler Monitor Screen -->
  <g transform="translate(60, 50)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="330" height="230" rx="14" fill="#1e293b" />
    <!-- Screen Viewport Header -->
    <rect x="0" y="0" width="330" height="28" rx="14" fill="#0f172a" />
    <circle cx="20" cy="14" r="5" fill="#f43f5e" />
    <circle cx="36" cy="14" r="5" fill="#fde047" />
    <circle cx="52" cy="14" r="5" fill="#4ade80" />
    <text x="165" y="18" font-family="'DM Sans', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Pipkin_MasterRig_v08.blend [3D Viewport]</text>

    <!-- 3D Grid Inside Viewport -->
    <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <line x1="20" y1="120" x2="310" y2="120" />
      <line x1="165" y1="40" x2="165" y2="210" />
      <line x1="40" y1="60" x2="290" y2="180" />
      <line x1="40" y1="180" x2="290" y2="60" />
    </g>

    <!-- Wireframe 3D Character Model inside screen -->
    <g transform="translate(165, 125)" stroke="#38bdf8" stroke-width="1.5" fill="none">
      <!-- Head sphere wire -->
      <circle cx="20" cy="-35" r="30" />
      <ellipse cx="20" cy="-35" rx="30" ry="12" />
      <ellipse cx="20" cy="-35" rx="12" ry="30" />
      <!-- Body wire -->
      <ellipse cx="-20" cy="20" rx="40" ry="26" />
      <!-- Rig Bones (Orange) -->
      <line x1="-20" y1="20" x2="20" y2="-35" stroke="#f97316" stroke-width="2.5" />
      <circle cx="-20" cy="20" r="4" fill="#f97316" />
      <circle cx="20" cy="-35" r="4" fill="#f97316" />
      <!-- Legs bone lines -->
      <line x1="-35" y1="35" x2="-40" y2="65" stroke="#f97316" stroke-width="2" />
      <line x1="-10" y1="35" x2="-8" y2="65" stroke="#f97316" stroke-width="2" />
      <line x1="10" y1="35" x2="15" y2="65" stroke="#f97316" stroke-width="2" />
    </g>

    <!-- Viewport Axis Gizmo -->
    <g transform="translate(290, 60)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#f43f5e" stroke-width="2" />
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#22c55e" stroke-width="2" />
      <line x1="0" y1="0" x2="-14" y2="14" stroke="#3b82f6" stroke-width="2" />
    </g>

    <!-- Stand -->
    <rect x="150" y="230" width="30" height="35" fill="#475569" />
    <rect x="115" y="265" width="100" height="12" rx="6" fill="#334155" />
  </g>

  <!-- Color Swatches & Material Moodboard (Right side) -->
  <g transform="translate(420, 60)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="140" height="180" rx="12" fill="#ffffff" />
    <text x="70" y="25" font-family="'Playfair Display', serif" font-size="12" font-weight="bold" fill="#7c2d12" text-anchor="middle">Color Harmony</text>
    <line x1="20" y1="35" x2="120" y2="35" stroke="#fed7aa" stroke-width="1" />

    <!-- Color Dots -->
    <circle cx="40" cy="60" r="16" fill="#f472b6" />
    <text x="70" y="65" font-family="'DM Sans', sans-serif" font-size="10" fill="#71717a">Blush Rose</text>

    <circle cx="40" cy="100" r="16" fill="#c084fc" />
    <text x="70" y="105" font-family="'DM Sans', sans-serif" font-size="10" fill="#71717a">Lavender Dusk</text>

    <circle cx="40" cy="140" r="16" fill="#fde047" />
    <text x="70" y="145" font-family="'DM Sans', sans-serif" font-size="10" fill="#71717a">Golden Wonder</text>
  </g>

  <!-- Concept Sketchbook & Stylus -->
  <g transform="translate(60, 315)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="#fdfbf7" stroke="#e2d9cc" stroke-width="2" />
    <line x1="110" y1="0" x2="110" y2="100" stroke="#d5c8b5" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Doodle on left page -->
    <ellipse cx="55" cy="50" rx="28" ry="20" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="2,3" fill="none" />
    <circle cx="70" cy="40" r="14" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="2,3" fill="none" />
    <text x="55" y="85" font-family="'Caveat', cursive" font-size="14" fill="#c2410c" text-anchor="middle">Initial Pony Silhouette</text>
    <!-- Notes on right page -->
    <line x1="125" y1="30" x2="195" y2="30" stroke="#cbd5e1" stroke-width="2" />
    <line x1="125" y1="45" x2="185" y2="45" stroke="#cbd5e1" stroke-width="2" />
    <line x1="125" y1="60" x2="175" y2="60" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Digital Stylus Pen -->
  <g transform="translate(290, 340) rotate(35)">
    <rect x="0" y="-5" width="90" height="10" rx="5" fill="#334155" />
    <polygon points="90,-5 105,0 90,5" fill="#f97316" />
    <rect x="15" y="-6" width="20" height="12" fill="#cbd5e1" rx="2" />
  </g>

  <!-- Cozy Mug of Herbal Tea with steam -->
  <g transform="translate(460, 320)">
    <rect x="0" y="20" width="46" height="55" rx="10" fill="#f43f5e" />
    <path d="M 46 30 C 60 30, 60 55, 46 55" stroke="#f43f5e" stroke-width="5" fill="none" />
    <!-- Clover on mug -->
    <circle cx="23" cy="45" r="6" fill="#fef08a" />
    <!-- Steam -->
    <path d="M 15 10 Q 20 0 15 -10" stroke="#fdba74" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M 28 8 Q 33 -2 28 -12" stroke="#fdba74" stroke-width="2" fill="none" opacity="0.6" />
  </g>
</svg>
